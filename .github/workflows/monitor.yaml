name: Weibo Hot Search Monitor

on:
  schedule:
    # 北京时间每 30 分钟运行一次
    # GitHub Actions 的 cron 使用 UTC；北京时间为 UTC+8，整小时偏移不影响 */30 分钟表达式
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # 支持在 Actions 页面手动触发，便于首次测试

permissions:
  contents: write  # 允许 workflow 使用 GITHUB_TOKEN 向仓库推送提交

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 从仓库 Secret 写入 Cookie，避免把真实 Cookie 提交到代码仓库
      - name: Write Weibo cookie
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          if [ -z "$WEIBO_COOKIE" ]; then
            echo "未配置 WEIBO_COOKIE Secret，请先在仓库 Settings 中添加"
            exit 1
          fi
          printf '%s' "$WEIBO_COOKIE" > weibo_cookie.txt

      - name: Run weibo_monitor.py
        run: python weibo_monitor.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weibo_data.csv
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "chore: update weibo_data.csv $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
